name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node prepare-www.js
      - run: npx cap add android
      - run: node prepare-android.js
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FocusFlow-v1.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-APK
          path: FocusFlow-v1.1.${{ github.run_number }}.apk
      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: FocusFlow v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: FocusFlow-v1.1.${{ github.run_number }}.apk
