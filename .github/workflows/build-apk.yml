name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis tempat APK ditempelkan (kosongkan untuk hanya membuat artifact)"
        default: "v1.0.0"
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan folder web
        run: |
          mkdir www
          cp index.html styles.css core.js goals-tasks.js habits-focus.js init.js manifest.webmanifest icon.svg sw.js www/

      - name: Pasang Capacitor dan buat proyek Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "FocusFlow" "com.sherlocomp.focusflow" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FocusFlow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-apk
          path: FocusFlow.apk

      - name: Tempel APK ke rilis
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.inputs.tag }}" FocusFlow.apk --clobber
